schemaVersion: 2

name: verifiable-certificates
description: >-
  Extend the verifiable-certificates template (AnonCreds credentials with Hedera
  as the Verifiable Data Registry, PDF documents on HCS-1, an accreditation registry contract, a relying party that
  decides from zero-knowledge proofs) without breaking its trust and privacy
  guarantees. The feature to build is described in .harness/prd.md.

# The existing app must be healthy before an agent touches it.
baseline:
  commands:
    - name: install
      command: yarn install
    - name: check
      command: yarn check

constraints:
  packageManager: yarn@3.2.3
  workspaces:
    - packages/hardhat
    - packages/nextjs
    - packages/sdk

# The harness defaults, plus the secret-bearing name this template uses
# (HEDERA_OPERATOR_KEY) and the rule that a secret never uses the NEXT_PUBLIC_ prefix.
secretScan:
  failOnFiles:
    - .env
    - packages/hardhat/.env
    - packages/nextjs/.env
    - packages/sdk/.env
  patterns:
    - name: private-key-assignment
      pattern: "(PRIVATE_KEY|OPERATOR_KEY|HEDERA_OPERATOR_PRIVATE_KEY)\\s*=\\s*(0x)?[0-9a-fA-F]{32,}"
    - name: next-public-secret
      pattern: "NEXT_PUBLIC_[A-Z0-9_]*(PRIVATE_KEY|OPERATOR_KEY|MNEMONIC|SECRET)"

# Tiers 2, 3 and 3.5 are deliberately not enabled; see docs/harness.md.
